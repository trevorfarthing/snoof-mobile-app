<svg viewBox="0 0 362 210" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky-afternoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9BD5" />
      <stop offset="60%" stop-color="#7BB8E0" />
      <stop offset="100%" stop-color="#A8D4E8" />
    </linearGradient>
  </defs>
  <rect width="362" height="210" fill="url(#sky-afternoon)" />
  <!-- sun high -->
  <circle r="22" fill="#FFF5D4" opacity="0.95" cy="30" cx="220" />
  <circle r="34" fill="#FFF5D4" opacity="0.15" cx="220" cy="30" />
  <!-- clouds -->
  <g opacity="0.6">
    <ellipse cx="20" cy="40" rx="30" ry="10" fill="white" />
    <ellipse cx="35" cy="36" rx="20" ry="8" fill="white" />
    <ellipse cx="10" cy="38" rx="15" ry="7" fill="white" />
  </g>
  <g opacity="0.4">
